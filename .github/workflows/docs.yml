name: Build and Deploy Documentation
on:
  push:
    branches:
      - develop
      - main/*
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - docs/**

jobs:

  documentation:

    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-22.04
    name: Build and deploy documentation

    steps:
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: Install (upgrade) python dependencies
      run: pip install --upgrade pip sphinx sphinx-gallery sphinx_rtd_theme sphinxcontrib-bibtex

    - name: Checkout
      uses: actions/checkout@v3

    - name: Build documentation
      run: .github/scripts/build-docs

    - name: Upload documentation (on success)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: documentation
        path: artifact/documentation

    - name: Upload warnings (on failure)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: documentation_warnings.log
        path: artifact/doc_warnings.log
        if-no-files-found: ignore

    - name: Add ReadTheDocs link to job summary
      if: ${{ github.event_name == 'pull_request' }}
      run: |
        echo '### ReadTheDocs preview' >> "$GITHUB_STEP_SUMMARY"
        echo 'https://epic-eagle--${{ github.event.pull_request.number }}.org.readthedocs.build/en/${{ github.event.pull_request.number }}' >> "$GITHUB_STEP_SUMMARY"

    - name: Comment ReadTheDocs link in PR
      if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: actions/github-script@v6
      with:
        script: |
          const message = `
          Link to ReadTheDocs sample build for this PR can be found at:
          https://epic-eagle--${{ github.event.pull_request.number }}.org.readthedocs.build/en/${{ github.event.pull_request.number }}
          `
          github.rest.issues.createComment({
           issue_number: context.issue.number,
           owner: context.repo.owner,
           repo: context.repo.repo,
           body: message
          })
