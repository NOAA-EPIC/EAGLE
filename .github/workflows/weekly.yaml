name: NRT EAGLE CI Pipeline Weekly

on:
  schedule:
    # Runs every Saturday at 06:00 UTC
    - cron: '0 6 * * 6'
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  run_pipeline:
    concurrency:
      group: nested-eagle-ci-run-pipeline
      cancel-in-progress: false
      queue: max
    name: Run Nested EAGLE end-to-end on Ursa
    runs-on: ursa
    timeout-minutes: 1440
    environment:
      name: autonomous

    steps:

      - name: Perform cleanup
        run: .github/scripts/cleanup

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false 


      - name: Build env and run pipeline
        env:
          PR_NUM: 99999
          SHA: ${{ github.sha }}  
          INSTALLDIR: conda
        run: .github/scripts/nested-eagle
    
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C0C7AJ84X3P", 
              "text": ":eagle: *${{ github.workflow }}* completed on *${{ runner.name }}* with status: *${{ job.status }}*"
            }
