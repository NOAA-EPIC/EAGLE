truth:
  name: PREPBUFR
  type: point
  url: https://noaa-reanalyses-pds.s3.amazonaws.com/observations/reanalysis/conv/prepbufr/{{ yyyymmdd[:4] }}/{{ yyyymmdd[4:6] }}/prepbufr/gdas.{{ yyyymmdd }}.t{{ hh }}z.prepbufr.nr
cycles:
  start: 2025-04-01T00:00:00
  step: 0
  stop: 2025-04-01T00:00:00  
forecast:
  coords:
    latitude: latitude
    longitude: longitude
    level: heightAboveGround
    time:
      inittime: forecast_reference_time
      validtime: time
  name: casestudy_hrrr_results
  path: hrrr_april_wxvx.zarr #assumes file is in the same directory as .yaml
  projection:
    a: 6371229
    b: 6371229
    lat_0: 38.5
    lat_1: 38.5
    lat_2: 38.5
    lon_0: 262.5
    proj: lcc
leadtimes:
  start: '6'
  step: '6:00:00'
  stop: '24'

meta:
  workdir: wxvx_output_prepbufr_hrrr
  grids: wxvx_output_prepbufr_hrrr/grids
  post_files: .

paths:
  grids:
    forecast: wxvx_output_prepbufr_hrrr/grids/forecast
  obs: wxvx_output_prepbufr_hrrr/obs
  run: wxvx_output_prepbufr_hrrr/run

regrid:
  method: BILIN
  to: G104
variables:
  t2m:
    level_type: heightAboveGround
    levels:
      - 2
    name: 2t