channels:
  - conda-forge
  - nodefaults
dependencies:
  - cuda-version=13.1
  - flash-attn 2.8.*
  - numpy 2.2.*
  - python 3.13
  - pytorch=2.10.*=cuda*
  - torchvision=0.25.*=cuda*
  - triton 3.6.*
  - pip:
      - anemoi-inference==0.12.*
      - anemoi-models==0.19.*
      - anemoi-training==0.17.*
      - anemoi-transform==0.5.*
      - datashader==0.19.*
      - eagle-tools==0.9.*
      - unified-workflow-tools==2.21.*

# NOTES
#
# cuda-version is a metapackage that constrains the CUDA version used to resolve
# dependencies. It influences which CUDA runtime libraries and CUDA-enabled
# packages conda selects.
#
# The conda flash-attn package provides prebuilt executables and libraries.
#
# The conda numpy, pytorch, and triton packages are installed by default as
# dependencies of the conda flash-attn package, but pip replaces them with
# different versions. Install the pip-required versions via conda to avoid this
# wasteful behavior.
#
# The current Anemoi packages don't support pytorch > 2.10, so install this
# version.
#
# torchvision is required by Anemoi. Installing with conda ensures that the
# selected package is compatible with the other CUDA-enabled packages.
