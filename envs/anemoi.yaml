# yamllint disable rule:anchors rule:line-length

channels:
  - nodefaults
  - conda-forge
  - ufs-community
dependencies:
  - datashader 0.19.*
  - flash-attn 2.8.*
  - matplotlib >=3.7.1,<3.9 # low bound per anemoi-training; high bound per matplotlib Issue 28317
  - mkl <2026 # 2026.x omits libmkl_gf_lp64.so.3 required by the resolved NumPy build
  - mpi4py 4.1.*
  - numpy 2.2.6.*
  - pip
  - python 3.12
  - pytorch 2.10.*
  - setuptools 81.0.*
  - torchvision 0.25.*
  - trimesh 5.1.*
  - triton 3.6.*
  - uwtools 2.21.*
  - pip:
      - anemoi-inference==0.12.*
      - anemoi-models==0.19.*
      - anemoi-training==0.17.*
      - anemoi-transform==0.5.*
      - eagle-tools==0.9.1
