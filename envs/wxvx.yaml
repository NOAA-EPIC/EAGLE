channels:
  - conda-forge
  - nodefaults
  - oar-gsl
  - ufs-community
dependencies:
  - netcdf-cxx4 4.3.1.*
  - numpy 2.2.*
  - pip
  - python 3.13
  - wxvx >=0.8.0
  - xesmf 0.8.*
  - zarr 2.18.*

# NOTES
#
# The netcdf-cxx4 item works around an issue with the metplus package reported
# here: https://github.com/dtcenter/METplus/discussions/3411. The MET programs
# require libnetcdf-cxx4.so.1, but the metplus conda package does not pin its
# netcdf-cxx4 package version, so libnetcdf-cxx4.so.3 is installed instead. This
# item can be removed if/when the upstream metplus conda package is fixed.
#
# The conda numpy and zarr packages are installed by default as dependencies of
# other conda package(s), but pip replaces them with different versions. Install
# the pip-required versions via conda to avoid this wasteful behavior.
#
# The wxvx package, currently only available via conda, installs uwtools as a
# dependency, so the ufs-community channel must be enabled, and there's then no
# need to install unified-workflow-tools via pip, as it will already be present.
