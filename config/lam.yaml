# This is the Nested EAGLE case.

# yamllint disable rule:anchors rule:line-length
app:
  experiment_name: lam
  time:
    step: !timedelta 6
    hrrr_step: !timedelta 1
grids_and_meshes:
  filenames:
    gfs_target_grid: !remove
    hrrr_target_grid: '{{ val.filenames.hrrr_target_grid }}'
    latent_mesh: '{{ val.filenames.latent_mesh }}'
  rundir: '{{ val.data.rundir }}'
  global_grid_resolution_deg: 0.25
  conus_grid_resolution_km: 6
  latent_mesh_conus_coarsen_factor: 2    # need to decide what to do here.. because its not this
  latent_mesh_global_resolution_deg: 2.0    # need to decide what to do here.. because its not this
inference:
  anemoi:
    input_dataset_kwargs: &dataset-kwargs
    # a guess here to start with
      hrrr:
        dataset:
          dataset: '{{ grids_and_meshes.rundir }}/hrrr.zarr'
      gfs:
        dataset:
          dataset: '{{ grids_and_meshes.rundir }}/gfs.zarr'
ufs2arco:
  source:
    analysis:
      t0:
        start: '{{ app.time.start.strftime("%Y-%m-%dT%H") }}'
        freq: '1h'
        end: '{{ app.time.stop.strftime("%Y-%m-%dT%H") }}'
    forecast:
      fhr:
        start: 1
        step: !int '{{ val.step }}'
        end: 1
      t0:
        start: '{{ (app.time.stop - app.time.hrrr_step).strftime("%Y-%m-%dT%H") }}'
        freq: '1h'
        end: '{{ (app.time.stop - app.time.hrrr_step).strftime("%Y-%m-%dT%H") }}'
      variables: !list '{{ val.variables.forecast }}'
  multisource_gfs:
    analysis:
      fhr:
        start: 0
        step: 1
        end: 5
      levels: !list '{{ val.levels }}'
      t0:
        start: '{{ app.time.start.strftime("%Y-%m-%dT%H") }}'
        freq: '6h'
        end: '{{ app.time.stop.strftime("%Y-%m-%dT%H") }}'
      variables: !list '{{ val.variables.multisource_gfs }}'
prewxvx:
  common:
    prewxvx: &prewxvx-common
      forecast_path: '{{ inference.anemoi.output_path }}'
      freq: '{{ app.time.freq }}'
      lead_time: !int '{{ app.time.max_leadtime }}'
      lam_index: 64220
      lcc_info:
        n_x: 338
        n_y: 190
      levels:
        - 250
        - 500
        - 850
      start_date: '{{ app.time.inference_start }}'
      end_date: '{{ app.time.inference_stop }}'
      vars_of_interest: !list '{{ vx.common.wxvx.variables.keys() | list }}'
    rundir: '{{ val.vx.rundir }}'
  global:
    prewxvx: &prewxvx-global
      name: global
      eagle_tools:
        <<: *prewxvx-common
        output_path: '{{ val.vx.rundir }}/postprocessed_files/{{ prewxvx.global.prewxvx.name }}'
        model_type: nested-global
        anemoi_reference_dataset_kwargs:
          <<: *dataset-kwargs
        forecast_regrid_kwargs:
          regridder_kwargs:
            method: 'conservative_normed'
          target_grid_path: '{{ val.data.rundir }}/{{ val.filenames.gfs_target_grid }}'
      rundir: '{{ val.vx.rundir }}/prewxvx/{{ prewxvx.global.prewxvx.name }}'
  lam:
    prewxvx: &prewxvx-lam
      name: lam
      eagle_tools:
        <<: *prewxvx-common
        output_path: '{{ val.vx.rundir }}/postprocessed_files/{{ prewxvx.lam.prewxvx.name }}'
        model_type: nested-lam
        vars_of_interest: !list '{{ dict(vx.common.wxvx.variables, accum_tp=vx.common.variables_stageiv.accum_tp).keys() | list }}'
      rundir: '{{ val.vx.rundir }}/prewxvx/{{ prewxvx.lam.prewxvx.name }}'
training:
  anemoi:
    defaults:
      - data: zarr
      - dataloader: native_grid
      - diagnostics: evaluation
      - graph: encoder_decoder_only
      - model: transformer
      - system: slurm
      - task: forecaster
      - training: single
      - _self_
    config_validation: True
    # Blocks to customize default Anemoi training config.
    data:
      format: zarr
      frequency: 1h
      datasets:
        hrrr:
          diagnostic:
            - accum_tp
            - u80
            - v80
          forcing:
            - cos_latitude
            - sin_latitude
            - cos_longitude
            - sin_longitude
            - cos_julian_day
            - sin_julian_day
            - cos_local_time
            - sin_local_time
            - insolation
            - lsm
            - orog
          processors:
            normalizer:
              _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
              config:
                default: mean-std
                max:
                  - orog
                min-max: null
                none:
                  - cos_latitude
                  - sin_latitude
                  - cos_longitude
                  - sin_longitude
                  - cos_julian_day
                  - sin_julian_day
                  - cos_local_time
                  - sin_local_time
                  - insolation
                  - lsm
                std:
                  - accum_tp
                  - sh2
                  - q_100
                  - q_150
                  - q_200
                  - q_250
                  - q_300
                  - q_400
                  - q_500
                  - q_600
                  - q_700
                  - q_850
                  - q_925
                  - q_1000
        gfs:   # right now this is all the same as the HRRR -- change to variables you have in gfs.zarr
          diagnostic:
            - accum_tp  # likely not using this in forcings, right?
            - u80
            - v80
          forcing:
            - cos_latitude
            - sin_latitude
            - cos_longitude
            - sin_longitude
            - cos_julian_day
            - sin_julian_day
            - cos_local_time
            - sin_local_time
            - insolation
            - lsm
            - orog
          processors:
            normalizer:
              _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
              config:
                default: mean-std
                max:
                  - orog
                min-max: null
                none:
                  - cos_latitude
                  - sin_latitude
                  - cos_longitude
                  - sin_longitude
                  - cos_julian_day
                  - sin_julian_day
                  - cos_local_time
                  - sin_local_time
                  - insolation
                  - lsm
                std:
                  - accum_tp
                  - sh2
                  - q_100
                  - q_150
                  - q_200
                  - q_250
                  - q_300
                  - q_400
                  - q_500
                  - q_600
                  - q_700
                  - q_850
                  - q_925
                  - q_1000
    dataloader:
      pin_memory: true
      persistent_workers: True
      fake_dataloading: False
      read_group_size: ${system.hardware.num_gpus_per_model}
      batch_size:
        test: 1
        training: 1
        validation: 1
      limit_batches:
        training: null
        validation: null
        test: 1
      prefetch_factor: 1
      num_workers:
        test: 1
        training: 1
        validation: 1
      test:
        datasets:
          hrrr:
            dataset_config:
              dataset: '{{ grids_and_meshes.rundir }}/hrrr.zarr'
              frequency: ${data.frequency}
            start: 2024
            end: 2025
          gfs:
            dataset_config:
              dataset: '{{ grids_and_meshes.rundir }}/gfs.zarr'
              frequency: ${data.frequency}
            start: 2024
            end: 2025
      training:
        datasets:
          hrrr:
            dataset_config:
              dataset: '{{ grids_and_meshes.rundir }}/hrrr.zarr'
              frequency: ${data.frequency}
            start: 2019
            end: 2022
          gfs:
            dataset_config:
              dataset: '{{ grids_and_meshes.rundir }}/gfs.zarr'
              frequency: ${data.frequency}
            start: 2019
            end: 2022
      validation:
        datasets:
          hrrr:
            dataset_config:
              dataset: /path/to/HRRR.zarr
              frequency: ${data.frequency}
            start: 2023
            end: 2024
          gfs:
            dataset_config:
              dataset: /path/to/GFS.zarr
              frequency: ${data.frequency}
            start: 2023
            end: 2024
    diagnostics:
      debug:
        anomaly_detection: false
      enable_checkpointing: true
      checkpoint:
        every_n_minutes:
          save_frequency: null
          num_models_saved: 0
        every_n_epochs:
          save_frequency: 1
          num_models_saved: -1
        every_n_train_steps:
          save_frequency: null
          num_models_saved: 0
      enable_progress_bar: true
      progress_bar:
        _target_: pytorch_lightning.callbacks.TQDMProgressBar
        refresh_rate: 1
      check_val_every_n_epoch: 1
      print_memory_summary: false
      log:
        interval: 100
        mlflow:
          enabled: True
          offline: True
          _target_: anemoi.training.diagnostics.mlflow.logger.AnemoiMLflowLogger
          authentication: False
          tracking_uri: null
          expand_hyperparams:
            - config
          experiment_name: lam-multidataset-testing
          http_max_retries: 35
          on_resume_create_child: True
          prefix: ''
          log_hyperparams: True
          max_params_length: 2000
          project_name: Nested-EAGLE
          run_name: null
          system: False
          terminal: True
          save_dir: ${system.output.logs.mlflow}
        wandb:
          enabled: false
          entity: null+
          _target_: pytorch_lightning.loggers.wandb.WandbLogger
          offline: False
          log_model: False
          project: placeholder
          gradients: False
          parameters: False
          interval: ${diagnostics.log.interval}
      plot:
        frequency:
          batch: 50
          epoch: 1
        sample_idx: 0
        parameters:
          - gh_500
          - t_850
          - u_850
          - v_850
          - t2m
          - sh2
          - u10
          - v10
          - sp
          - accum_tp
        datasets_to_plot: ["hrrr"]
        focus_areas: null
        settings:
          asynchronous: false
          datashader: true
          precip_and_related_fields:
            - accum_tp
          colormaps:
            default:
              _target_: anemoi.training.utils.custom_colormaps.MatplotlibColormap
              name: viridis
            error:
              _target_: anemoi.training.utils.custom_colormaps.MatplotlibColormap
              name: bwr
            precip:
              _target_: anemoi.training.utils.custom_colormaps.MatplotlibColormapClevels
              clevels: ["#ffffff", "#04e9e7", "#019ff4", "#0300f4", "#02fd02", "#01c501", "#008e00", "#fdf802", "#e5bc00", "#fd9500", "#fd0000", "#d40000", "#bc0000", "#f800fd"]
              variables: ${diagnostics.plot.settings.precip_and_related_fields}
        callbacks:
          - _target_: anemoi.training.diagnostics.callbacks.plot.LossCurvePlot
            dataset_names: ${diagnostics.plot.datasets_to_plot}
            every_n_batches: ${diagnostics.plot.frequency.batch}
            parameter_groups:
              moisture:
                - accum_tp
              sfc_wind:
                - u10
                - v10
          - _target_: anemoi.training.diagnostics.callbacks.plot.BatchOutputPlot
            tag_infix: sample
            dataset_names: ${diagnostics.plot.datasets_to_plot}
            sample_idx: ${diagnostics.plot.sample_idx}
            parameters: ${diagnostics.plot.parameters}
            every_n_batches: ${diagnostics.plot.frequency.batch}
            with_auxiliary: true
            focus_area: null
            plot_fn:
              _target_: anemoi.training.diagnostics.evaluation.plotting.batch_output.sample_plot_fn
              _partial_: true
              per_sample: 6
              accumulation_levels_plot: [0.1, 0.25, 0.5, 1, 2, 5, 10, 100]
              prediction_label: pred
              auxiliary_label: corrupted targets
          - _target_: anemoi.training.diagnostics.callbacks.plot.BatchOutputPlot
            tag_infix: histo
            dataset_names: ${diagnostics.plot.datasets_to_plot}
            every_n_batches: ${diagnostics.plot.frequency.batch}
            parameters:
              - gh_500
              - accum_tp
              - t2m
              - u10
              - v10
            plot_fn:
              _target_: anemoi.training.diagnostics.evaluation.plotting.batch_output.histogram_plot_fn
              _partial_: true
              log_scale: false
            sample_idx: ${diagnostics.plot.sample_idx}
      benchmark_profiler:
        memory:
          enabled: true
          steps: 5
          warmup: 2
          extra_plots: false
          trace_rank0_only: false
        time:
          enabled: true
          verbose: false
        speed:
          enabled: true
        system:
          enabled: true
        model_summary:
          enabled: true
        snapshot:
          enabled: true
          steps: 4
          warmup: 0
    graph:
      overwrite: True
      nodes:
        hrrr:
          node_builder:
            _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
            dataset: ${dataloader.training.datasets.hrrr.dataset_config}
          attributes: ${graph.attributes.nodes}
        gfs:
          node_builder:
            _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
            dataset: ${dataloader.training.datasets.gfs.dataset_config}
          attributes: ${graph.attributes.nodes}
        hidden:
          node_builder:
            _target_: anemoi.graphs.nodes.NPZFileNodes
            npz_file: ${system.input.latent_mesh}
            lat_key: lat
            lon_key: lon
      edges:
        # HRRR Encoder
        - source_name: hrrr
          target_name: hidden
          edge_builders:
            - _target_: anemoi.graphs.edges.KNNEdges
              num_nearest_neighbours: 12
              source_mask_attr_name: null
              target_mask_attr_name: null
          attributes: ${graph.attributes.edges}
        - source_name: gfs
          target_name: hidden
          edge_builders:
            - _target_: anemoi.graphs.edges.KNNEdges
              num_nearest_neighbours: 12
              source_mask_attr_name: null
              target_mask_attr_name: null
          attributes: ${graph.attributes.edges}
        # HRRR Decoder
        - source_name: hidden
          target_name: hrrr
          edge_builders:
            - _target_: anemoi.graphs.edges.KNNEdges
              num_nearest_neighbours: 3
              source_mask_attr_name: null
              target_mask_attr_name: null
          attributes: ${graph.attributes.edges}
        # GFS decoder may not be needed (instinct says no.. add it if I am wrong)
      attributes:
        nodes:
          # Attributes for data nodes
          area_weight:
            _target_: anemoi.graphs.nodes.attributes.SphericalAreaWeights
            norm: unit-max
            fill_value: 0
        edges:
          edge_length:
            _target_: anemoi.graphs.edges.attributes.EdgeLength
            norm: unit-max
          edge_dirs:
            _target_: anemoi.graphs.edges.attributes.EdgeDirection
            norm: unit-std
    system:
      input:
        dataset: null
        global_dataset: '{{ val.data.rundir }}/gfs.zarr'
        graph: '{{ val.data.rundir }}/graph.latentx2.spongex1.12knn.pt'
        lam_dataset: '{{ val.data.rundir }}/hrrr.zarr'
        latent_mesh: '{{ val.data.rundir }}/latentx2.spongex1.combined.sorted.npz'
        truncation: null
        truncation_inv: null
        loss_matrices_path: null
        warm_start: null
      hardware:
        accelerator: auto
        num_gpus_per_model: 1
        num_gpus_per_node: ${oc.decode:${oc.env:SLURM_GPUS_PER_NODE}}
        num_nodes: ${oc.decode:${oc.env:SLURM_NNODES}}
      output:
        root: '{{ training.rundir }}/outputs/'
        logs:
          root: logs
          mlflow: mlflow
          wandb: wandb
          tensorboard: tensorboard
        checkpoints:
          root: checkpoint
          every_n_epochs: anemoi-by_epoch-epoch_{epoch:03d}-step_{step:06d}
          every_n_train_steps: anemoi-by_step-epoch_{epoch:03d}-step_{step:06d}
          every_n_minutes: anemoi-by_time-epoch_{epoch:03d}-step_{step:06d}
        plots: plots
        profiler: profiler
    model:
      num_channels: 512
      cpu_offload: false
      keep_batch_sharded: true
      model:
        _target_: anemoi.models.models.AnemoiModelEncProcDec
        hidden_nodes_name: "hidden"
        latent_skip: True
      layer_kernels:
        LayerNorm:
          _target_: torch.nn.LayerNorm
        Linear:
          _target_: torch.nn.Linear
        Activation:
          _target_: torch.nn.GELU
        QueryNorm:
          _target_: anemoi.models.layers.normalization.AutocastLayerNorm
          bias: false
        KeyNorm:
          _target_: anemoi.models.layers.normalization.AutocastLayerNorm
          bias: false
      processor:
        _target_: anemoi.models.layers.processor.TransformerProcessor
        num_channels: ${model.num_channels}
        num_layers: 16
        num_chunks: 1
        mlp_hidden_ratio: 4
        mlp_implementation: mlp
        num_heads: 16
        window_size: 4320
        dropout_p: 0.0
        attention_implementation: flash_attention
        qk_norm: false
        softcap: 0.0
        use_alibi_slopes: false
        cpu_offload: ${model.cpu_offload}
        gradient_checkpointing: True
        use_rotary_embeddings: false
        layer_kernels: ${model.layer_kernels}
      encoders:
        global: # user-defined key. It will appear in the state-dict
          source_datasets: ["gfs"]
          dataset_fusing_strategy: "not_supported"
          mapper:
            _target_: anemoi.models.layers.mapper.GraphTransformerForwardMapper
            num_channels: ${model.num_channels}
            trainable_size: ${model.edge_trainable_parameters.data2hidden}
            sub_graph_edge_attributes: ${model.attributes.edges}
            num_chunks: 1
            mlp_hidden_ratio: 4
            mlp_implementation: mlp
            num_heads: 16
            qk_norm: false
            cpu_offload: ${model.cpu_offload}
            gradient_checkpointing: True
            layer_kernels: ${model.layer_kernels}
            shard_strategy: edges
            graph_attention_backend: triton
            edge_pre_mlp: False
        regional: # user-defined key. It will appear in the state-dict
          source_datasets: ["hrrr"]
          dataset_fusing_strategy: "not_supported"
          mapper:
            _target_: anemoi.models.layers.mapper.GraphTransformerForwardMapper
            num_channels: ${model.num_channels}
            trainable_size: ${model.edge_trainable_parameters.data2hidden}
            sub_graph_edge_attributes: ${model.attributes.edges}
            num_chunks: 1
            mlp_hidden_ratio: 4
            mlp_implementation: mlp
            num_heads: 16
            qk_norm: false
            cpu_offload: ${model.cpu_offload}
            gradient_checkpointing: True
            layer_kernels: ${model.layer_kernels}
            shard_strategy: edges
            graph_attention_backend: triton
            edge_pre_mlp: False
      latent_aggregator:
        _target_: anemoi.models.layers.aggregator.SumAggregator
      decoders:
        regional: # user-defined key. It will appear in the state-dict
          target_datasets: ["hrrr"]
          target_node_features: ["encoded_data"]
          mapper:
            _target_: anemoi.models.layers.mapper.GraphTransformerBackwardMapper
            num_channels: ${model.num_channels}
            trainable_size: ${model.edge_trainable_parameters.hidden2data}
            sub_graph_edge_attributes: ${model.attributes.edges}
            num_chunks: 1
            mlp_hidden_ratio: 4
            mlp_implementation: mlp
            num_heads: 16
            initialise_data_extractor_zero: false
            qk_norm: false
            cpu_offload: ${model.cpu_offload}
            gradient_checkpointing: True
            layer_kernels: ${model.layer_kernels}
            shard_strategy: edges
            graph_attention_backend: triton
            edge_pre_mlp: False
        # GFS decoder may not be needed (instinct says no.. add it if I am wrong)
      residual:
        datasets:
          hrrr:
            _target_: anemoi.models.layers.residual.SkipConnection
            step: -1
      output_mask:
        datasets:
          hrrr:
            _target_: anemoi.training.utils.masks.NoOutputMask
      node_trainable_parameters:
        hrrr: 8
        gfs: 8
        hidden: 8
      edge_trainable_parameters:
        gfs2hidden: 8
        hrrr2hidden: 8
        hidden2hrrr: 8
      attributes:
        edges:
          - edge_length
          - edge_dirs
        nodes: []
      compile:
        - module: anemoi.models.layers.conv.GraphTransformerConv
      bounding:
        datasets:
          hrrr:
            - _target_: anemoi.models.layers.bounding.ReluBounding
              variables: !list '{{ training.anemoi.data.datasets.hrrr.processors.normalizer.config.std }}'
    task:
      _target_: anemoi.training.tasks.Forecaster
      multistep_input: '{{ app.time.multistep_input }}'
      multistep_output: 1
      timestep: "6H"
      validation_rollout: null
      rollout:
        start: 1
        epoch_increment: 0
        maximum: 1
    training:
      run_id: null
      fork_run_id: null
      load_weights_only: false
      update_ds_stats_on_ckpt_load:
        states: False
        tendencies: True
      transfer_learning: false
      deterministic: false
      check_variables_compatibility:
        ignore_units: False
        ignore_processing_period: False
      precision: 16-mixed
      accum_grad_batches: 1
      num_sanity_val_steps: 6
      gradient_clip:
        val: 32.0
        algorithm: value
      method:
        _target_: anemoi.training.train.methods.SingleTraining
      strategy:
        _target_: anemoi.training.distributed.strategy.DDPGroupStrategy
        num_gpus_per_model: ${system.hardware.num_gpus_per_model}
        read_group_size: ${dataloader.read_group_size}
        use_local_synchronization: True
        broadcast_buffers: False
      loss_gradient_scaling: false
      validation_metrics:
        datasets:
          hrrr:
            mse:
              _target_: anemoi.training.losses.MSELoss
              scalers:
                - node_weights
              ignore_nans: true
      max_epochs: null
      max_steps: 20
      submodules_to_freeze: []
      weight_averaging: null
      optimization:
        optimizer:
          _target_: torch.optim.AdamW
          betas: [0.9, 0.95]
          weight_decay: 0.01
        lr: 0.0000625
        lr_scheduler:
          _target_: timm.scheduler.CosineLRScheduler
          t_initial: ${training.max_steps}
          lr_min: 3.e-7
          warmup_t: 2
          t_in_epochs: false
      metrics:
        datasets:
          hrrr:
            - gh_500
            - t_850
            - u_850
            - v_850
      scalers:
        datasets:
          hrrr:
            general_variable:
              _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
              weights:
                accum_tp: 0.025
                default: 1
                gh: 12
                q: 0.6
                sp: 10
                t: 6
                u: 0.8
                u10: 0.1
                v: 0.5
                v10: 0.1
                w: 0.001
            pressure_level:
              _target_: anemoi.training.losses.scalers.ReluVariableLevelScaler
              group: pl
              y_intercept: 0.2
              slope: 0.001
            nan_mask_weights:
              _target_: anemoi.training.losses.scalers.NaNMaskScaler
            stdev_tendency:
              _target_: anemoi.training.losses.scalers.StdevTendencyScaler
            var_tendency:
              _target_: anemoi.training.losses.scalers.VarTendencyScaler
            node_weights:
              _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
              nodes_attribute_name: area_weight
              norm: unit-sum
            time_steps:
              _target_: anemoi.training.losses.scalers.UniformTimeStepScaler
      training_loss:
        datasets:
          hrrr:
            _target_: anemoi.training.losses.MSELoss
            ignore_nans: false
            scalers: ["general_variable", "nan_mask_weights", "node_weights"]
      variable_groups:
        datasets:
          hrrr:
            default: sfc
            pl:
              param:
                - gh
                - q
                - t
                - u
