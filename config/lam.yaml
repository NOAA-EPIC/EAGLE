        rundir: '{{ val.vx.rundir }}/grid2stageiv/lam'
        wxvx: # config for the wxvx application
          cycles: !dict '{{ vx.common.wxvx.cycles }}'
          truth:
            name: STAGEIV
            type: grid
            url: https://nomads.ncep.noaa.gov/pub/data/nccf/com/pcpanl/prod/pcpanl.{{ yyyymmdd }}/st4_conus.{{ yyyymmdd }}{{ hh }}.01h.grb2
          forecast: !dict '{{ vx.grid2grid.lam.wxvx.wxvx.forecast }}'
          leadtimes: !dict '{{ vx.common.wxvx.leadtimes }}'
          meta: !dict '{{ vx.common.wxvx.meta | replace("TRUTH", "grid2stageiv") | replace("EXTENT", "lam") }}'
          ncdiffs: !bool '{{ vx.grid2grid.global.wxvx.wxvx.ncdiffs }}'
          paths: !dict '{{ vx.common.paths_grid | replace("TRUTH", "grid2stageiv") | replace("EXTENT", "lam") }}'
          regrid: !dict '{{ vx.grid2grid.global.wxvx.wxvx.regrid }}'
          variables: !dict '{{ vx.common.variables_stageiv }}'
zarrs:
  hrrr:
    zarr:
      execution:
        batchargs: !dict '{{ zarrs.common.execution.batchargs }}'
        envcmds: !list '{{ zarrs.common.execution.envcmds }}'
        executable: ufs2arco ufs2arco-hrrr.yaml --overwrite
        mpiargs: !list '{{ zarrs.common.execution.mpiargs }}'
        mpicmd: '{{ zarrs.common.execution.mpicmd }}'
      name: hrrr
      rundir: '{{ val.data.rundir }}'
      ufs2arco:
        directories: !dict '{{ ufs2arco.dirs | replace("X", "hrrr") }}'
        mover: !dict '{{ ufs2arco.mover }}'
        multisource:
          - source: !dict '{{ dict(ufs2arco.source.analysis, name="aws_hrrr_archive") }}'
            transforms:
              rotate_vectors:
                vector_pairs:
                  - ['u', 'v']
                  - ['u10', 'v10']
                  - ['u80', 'v80']
          - source: !dict '{{ dict(ufs2arco.source.forecast, name="aws_hrrr_archive") }}'
        target: !dict '{{ ufs2arco.target }}'
        transforms:
          horizontal_regrid:
            regridder_kwargs: !dict '{{ dict(ufs2arco.regridder, filename="conservative_1059x1799_211x359.nc") }}'
            target_grid_path: '{{ val.data.rundir }}/{{ val.filenames.hrrr_target_grid }}'
    platform: !dict '{{ app.platform }}'
  gfs:
    zarr:
      ufs2arco:
        multisource: !remove
        source: !dict '{{ dict(ufs2arco.multisource_gfs.analysis, name="gfs_archive") }}'
        target: !dict '{{ ufs2arco.target }}'
        transforms: !remove
val:
  filenames:
    gfs_target_grid: !remove
    hrrr_target_grid: hrrr_6km.nc
    latent_mesh: latentx2.spongex1.combined.sorted.npz
  variables:
    multisource_gfs:
      # 3D Prognostic
      - gh
      - u
      - v
      - w
      - t
      - q
      # 2D Prognostic
      - sp
      - u10
      - v10
      - t2m
      - t_surface
      - sh2
      # Diagnostic
      - u80
      - v80
      # Forcing
      - lsm
      - orog
